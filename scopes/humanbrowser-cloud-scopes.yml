summary: >-
  Two scope vocabularies from two OAuth surfaces that do not reference each other. The OpenAPI's oauth2
  clientCredentials scheme declares session:run, account:read and account:topup and binds them per
  operation — but its tokenUrl (https://agent.humanbrowser.cloud/oauth/token) 404s on GET and POST. The
  live authorization server's RFC 8414 metadata on the same host declares mcp:run and mcp:read for the
  MCP resource, with no per-tool binding published anywhere. Neither vocabulary is documented on a
  scopes/permissions page (/docs/oauth 404). Every shipped integration uses the unscoped hb_live_ bearer
  token instead.
