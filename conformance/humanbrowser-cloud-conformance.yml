summary: >-
  Human Browser's conformance profile is the agent-protocol stack, declared in its own contracts rather
  than claimed in marketing: an A2A 0.3.0 agent card served at the RFC 8615 well-known path on two hosts,
  JSON-RPC 2.0 with SSE streaming, an MCP Streamable HTTP endpoint with RFC 9728 protected-resource metadata
  and RFC 8414 authorization-server metadata (OAuth 2.1 shape: PKCE S256, client-ID metadata documents,
  dynamic client registration), an OpenAI plugin manifest, llms.txt, and an OpenAPI 3.1.0. It declares no
  RFC 9457 problem details, no RFC 9116 security.txt, no OIDC, no RFC 9727 API catalog, no APIs.json, no
  Sunset signalling, and no security certification (no SOC 2 / ISO 27001 claim anywhere). UK GDPR / EU GDPR
  are named as the privacy regime with a 72-hour breach clock.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  domain_standard_signature: true
  evidence: >-
    a2a/humanbrowser-cloud-agent-card.json — protocolVersion "0.3.0", url https://agent.humanbrowser.cloud/a2a,
    preferredTransport JSONRPC, capabilities object {streaming, pushNotifications, stateTransitionHistory},
    skills[] of 9, securitySchemes http bearer. POST /a2a answered a JSON-RPC 2.0 error envelope (HTTP 401).
    Graded conformant in a2a/humanbrowser-cloud-a2a.yml. This is the contract-level declaration of the
    agent-runtime market's interoperability standard.
- id: mcp
  name: Model Context Protocol (Streamable HTTP + stdio)
  conforms: true
  verification: partial
  domain_standard_signature: true
  evidence: >-
    POST https://agent.humanbrowser.cloud/mcp answers 401 with WWW-Authenticate: Bearer realm="humanbrowser-mcp"
    and CORS allow-lists Mcp-Session-Id / MCP-Protocol-Version; GET is 405. The npm package's mcp/server.js
    is built on @modelcontextprotocol/sdk ^1.29.0 and registers ListTools/CallTool handlers with JSON-Schema
    inputSchemas. The protocol version negotiated by the hosted endpoint was not observed (gated).
