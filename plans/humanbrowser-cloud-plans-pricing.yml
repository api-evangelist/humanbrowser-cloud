summary: >-
  Two pricing stories are published and they disagree. Every human-facing page (install, docs/mcp, the
  pricing modal, llms.txt, Terms of Service section 4 dated 2026-05-15) says: prepaid balance, no
  subscription, no auto-renew, top up $20 / $80 / $200 or any custom amount between $1 and $2,000, balance
  never expires, metered at $0.10 per browser-minute, $4 per GB residential bandwidth, $0.005 per solved
  CAPTCHA, hosted AI from $0.005 per 1K tokens (or per task from $0.02). The unauthenticated JSON at
  GET /api/plans — the URL the agent card names as pricing_json_url and the operation the OpenAPI calls
  getPlans — instead lists three MONTHLY SUBSCRIPTIONS (Starter $20/mo, Pro $80/mo, Enterprise $400/mo)
  with a monthly usage balance, rollover caps and country allow-lists, and says "Subscribe $X, get $X usage
  balance"; it also says LLM tokens are "pass-through with BYO API key" where the site prices hosted AI. The
  Terms commit to 14 days' notice on this page before rates change. Both are recorded verbatim below; the
  prepaid model is the one the Terms bind, and an agent that reads only /api/plans will be told a model the
  provider's own Terms do not describe.
