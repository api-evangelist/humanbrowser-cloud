summary:
  types:
  - http
  - apiKey
  - oauth2
  api_key_in:
  - cookie
  oauth2_flows:
  - clientCredentials (declared in the OpenAPI; tokenUrl dead)
  - authorizationCode + PKCE (live on agent.humanbrowser.cloud via RFC 8414 metadata; undocumented)
  bearer: true
  credential_classes: 4
  headline: >-
    One prepaid-balance bearer token (hb_live_...) is the credential every published integration uses —
    the A2A endpoint, the hosted MCP endpoint, the stdio MCP server (HB_TOKEN env, legacy alias
    HUMANBROWSER_API_TOKEN), the SDK, the CLI and the token-scoped REST operations. A dashboard session
    cookie (hb_session) guards getAccount. The OpenAPI also declares an oauth2 clientCredentials scheme
    with three scopes whose tokenUrl 404s, and the agent host serves a live OAuth 2.1 authorization server
    (authorization code + PKCE S256, client-ID metadata documents or DCR ids hbc_<32hex>, scopes mcp:run /
    mcp:read) advertised for the MCP resource by RFC 9728 metadata — but no documentation page describes
    that flow (service_documentation /docs/oauth 404) and every guide says "use the bearer token".
schemes:
- name: bearerAuth
  type: http
  scheme: bearer
  token_prefix: hb_live_
  description: 'Human Browser API token (hb_live_… or trial). Send as Authorization: Bearer <token>.'
  issuance:
    trial: POST /api/trial-balance {email} (claimTrial) — $10 balance, one per email, revoked after 14 days without a top-up
    paid: issued on first top-up; the card says POST /api/buy returns a fresh token by webhook after a crypto payment
    dashboard: https://humanbrowser.cloud/account
  used_by: [topUp, getUsage, runA2ATask, 'POST /mcp (hosted MCP)', 'GET /api/balance on the agent host (CLI balance; not in the OpenAPI)']
  observed:
