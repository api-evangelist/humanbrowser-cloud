openapi: 3.2.0
info:
  title: Human Browser Account API
  version: 1.1.0
  description: 'Human Browser: a cloud browser agent for AI agents. Send a natural-language goal; a real Chromium on a residential IP runs it and returns the answer plus a live viewer URL. This spec covers the public account endpoints on humanbrowser.cloud and the A2A JSON-RPC endpoint on agent.humanbrowser.cloud (per-operation servers). Agent-oriented guide: https://humanbrowser.cloud/llms-full.txt. Agent card: https://agent.humanbrowser.cloud/.well-known/agent-card.json.'
  contact:
    name: Virix Labs
    url: https://humanbrowser.cloud
    email: general@virixlabs.com
  license:
    name: Apache-2.0
    url: https://github.com/VirixLabs/humanbrowser
servers:
- url: https://humanbrowser.cloud
  description: Account API
- url: https://agent.humanbrowser.cloud
  description: A2A + MCP + sessions (Bearer token)
security:
- bearerAuth: []
tags:
- name: Account
  description: Token, balance and top-ups
paths:
  /api/trial-balance:
    post:
      tags:
      - Account
      operationId: claimTrial
      summary: Sign up by email (magic sign-in link)
      description: 'Email-gated sign-up. Sends a one-time sign-in link to /account. No free credit: new accounts start at $0 balance; the first top-up can be $1 (one real task), later top-ups from $5.'
      security: []
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Sign-in link emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                    example: magic-link
                  email:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/account:
    get:
      tags:
      - Account
      operationId: getAccount
      summary: 'Get the signed-in account: token, balance, session count'
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Account record
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  balance_usd:
                    type: number
                  spent_usd:
                    type: number
                  session_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/topup:
    post:
      tags:
      - Account
      operationId: topUp
      summary: Create a Stripe or crypto top-up for prepaid balance
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_usd
              properties:
                amount_usd:
                  type: number
                  minimum: 1
                method:
                  type: string
                  enum:
                  - stripe
                  - crypto
      responses:
        '200':
          description: Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/plans:
    get:
      tags:
      - Account
      operationId: getPlans
      summary: List pay-as-you-go rates and top-up options
      security: []
      responses:
        '200':
          description: Pricing
          content:
            application/json: {}
        '500':
          $ref: '#/components/responses/ServerError'
  /api/usage:
    get:
      tags:
      - Account
      operationId: getUsage
      summary: Recent usage for the authenticated token
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Usage rows
          content:
            application/json: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/balance:
    get:
      tags:
      - Account
      operationId: getBalance
      servers:
      - url: https://agent.humanbrowser.cloud
      summary: Balance of the token in the Authorization header
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_usd:
                    type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    ApiVersion:
      name: X-API-Version
      in: header
      required: false
      description: Pin the API version (date-based). Defaults to the latest stable.
      schema:
        type: string
        default: '2026-08-01'
  responses:
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Uniform typed error model returned by every 4xx/5xx response.
      required:
      - error
      properties:
        error:
          type: string
          description: Stable machine-readable error code, e.g. invalid-email, not-signed-in, rate-limited, insufficient-balance, server-error.
        message:
          type: string
          description: Human-readable explanation.
        hint:
          type: string
          description: Optional remediation hint for agents.
        retry_after_seconds:
          type: integer
          description: Present on 429; how long to wait before retrying.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token hb_live_<owner>_<32 hex> from https://humanbrowser.cloud/account. Send as Authorization: Bearer <token>; never in a URL.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: hb_session
      description: Login session cookie for account endpoints.
    oauth2:
      type: oauth2
      description: OAuth 2.1 for the MCP endpoint (https://agent.humanbrowser.cloud/mcp). The issued access token is the account's hb_live token, so it also works as bearerAuth.
      flows:
        authorizationCode:
          authorizationUrl: https://agent.humanbrowser.cloud/authorize
          tokenUrl: https://agent.humanbrowser.cloud/token
          refreshUrl: https://agent.humanbrowser.cloud/token
          scopes:
            mcp:run: Start and drive browser tasks
            mcp:read: Read task status
externalDocs:
  description: LLM-friendly reference
  url: https://humanbrowser.cloud/llms-full.txt
x-provenance:
  method: harvested
  publisher: Virix Labs
  source: https://humanbrowser.cloud/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
