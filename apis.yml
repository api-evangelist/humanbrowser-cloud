aid: humanbrowser-cloud
name: Virix Labs
description: >-
  Virix Labs is the trading name of Virix Ltd, a London software company (England & Wales no. 16325097,
  incorporated March 2025) that builds and operates Human Browser at humanbrowser.cloud: a hosted "cloud
  Chromium for AI agents" that runs a natural-language browser goal on a residential IP behind a live viewer
  a person can watch and take over, with CAPTCHA handling, persistent per-token cookie profiles and metered
  prepaid pricing ($0.10 per browser-minute, $4/GB bandwidth, $0.005 per solved CAPTCHA). The same runtime is
  exposed four ways: an A2A 0.3.0 agent card at /.well-known/agent-card.json with nine skills and a JSON-RPC
  endpoint at agent.humanbrowser.cloud/a2a; a Model Context Protocol server both hosted
  (agent.humanbrowser.cloud/mcp, with RFC 9728 protected-resource and RFC 8414 authorization-server metadata)
  and shipped as a stdio server in the npm package @virixlabs/humanbrowser; a six-operation OpenAPI 3.1.0
  REST account API at humanbrowser.cloud/openapi.json; and an OpenAI plugin manifest plus llms.txt. Virix
  Labs also sells agent-run marketing and web-operations services at virixlabs.com.
