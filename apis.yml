apis:
- aid: humanbrowser-cloud:human-browser-api
  name: Human Browser API
  description: >-
    The REST account side of Human Browser, published as OpenAPI 3.1.0 at https://humanbrowser.cloud/openapi.json
    with servers[] https://humanbrowser.cloud (account) and https://agent.humanbrowser.cloud (A2A + MCP): claim
    a free trial token by email (claimTrial), read the signed-in account (getAccount, session cookie), create
    a Stripe or crypto top-up (topUp), read the unauthenticated rate sheet (getPlans), read usage (getUsage),
    and runA2ATask, which is the JSON-RPC A2A endpoint described as one POST. Bearer hb_live_ tokens carry a
    prepaid balance; an optional X-API-Version header (default 2026-08-01) pins the surface. A uniform
    {error, message, hint, retry_after_seconds} envelope; no idempotency key on any write.
  humanURL: https://humanbrowser.cloud/docs
  baseURL: https://humanbrowser.cloud
  tags:
  - Browser Automation
  - Cloud Browser
  - AI Agents
  - Billing
  properties:
  - type: OpenAPI
    url: openapi/humanbrowser-cloud-openapi.json
  - type: OpenAPI
    name: Human Browser API OpenAPI (provider-hosted)
    url: https://humanbrowser.cloud/openapi.json
