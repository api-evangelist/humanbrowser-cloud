- aid: humanbrowser-cloud:humanbrowser-mcp-server
  name: Human Browser MCP Server
  description: >-
    Model Context Protocol access to the same browser runtime, shipped two ways: a hosted Streamable HTTP
    endpoint at https://agent.humanbrowser.cloud/mcp that requires the hb_live_ bearer token (anonymous
    initialize and tools/list answer 401 with WWW-Authenticate: Bearer realm="humanbrowser-mcp"; 60 requests
    per 60 s per token) and a stdio server inside the npm package (`npx -y @virixlabs/humanbrowser mcp`,
    HB_TOKEN env). The package source exposes three tools — humanbrowser_run, humanbrowser_stream,
    humanbrowser_viewer_url — with JSON-Schema inputSchemas; the provider's MCP docs page describes a
    different six-tool surface that could not be verified. RFC 9728 protected-resource metadata names this
    endpoint as an OAuth resource (scopes mcp:run, mcp:read) with an authorization server on the same host.
  humanURL: https://humanbrowser.cloud/docs/mcp
  baseURL: https://agent.humanbrowser.cloud/mcp
  tags:
  - MCP
  - agent-native
  - Browser Automation
  properties:
  - type: MCPServer
    url: mcp/humanbrowser-cloud-mcp.yml
  - type: MCPServer
    name: Human Browser MCP endpoint (Streamable HTTP)
    url: https://agent.humanbrowser.cloud/mcp
  - type: ToolCrosswalk
    url: mcp/humanbrowser-cloud-tool-crosswalk.yml
  - type: Documentation
    url: https://humanbrowser.cloud/docs/mcp
- aid: humanbrowser-cloud:humanbrowser-a2a-agent
  name: Human Browser A2A Agent
  description: >-
    Agent2Agent protocol surface: an agent card (protocolVersion 0.3.0, JSONRPC, version 5.1.0) served
    byte-identically from https://agent.humanbrowser.cloud/.well-known/agent-card.json and the website apex,
    advertising nine skills — browser_task, login_and_scrape, meta_business_workflow, fill_form, scrape_url,
    relay_reverse_api, hostile_site_solver, email_verified_signup, network_discovery — reached through
    message/send or message/stream (SSE) at POST https://agent.humanbrowser.cloud/a2a with tasks/get and
    tasks/cancel, plus twelve provider "actions/*" JSON-RPC methods. Streaming, push notifications
    (callback_url) and an input-required human-in-the-loop pause with a documented resume contract; every
    call needs the hb_live_ bearer token (anonymous calls return HTTP 401 / JSON-RPC -32001). Graded
    conformant against A2A 1.0.0 hard checks.
  humanURL: https://humanbrowser.cloud/a2a
  baseURL: https://agent.humanbrowser.cloud/a2a
  tags:
  - A2A
  - agent-native
  - Browser Automation
  - Human-in-the-Loop
  properties:
  - type: AgentCard
    url: a2a/humanbrowser-cloud-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://agent.humanbrowser.cloud/.well-known/agent-card.json
  - type: Documentation
    url: https://humanbrowser.cloud/a2a
  - type: Webhooks
    url: asyncapi/humanbrowser-cloud-webhooks.yml
